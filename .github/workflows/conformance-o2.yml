name: Conformance tests (-O2)

# Runs the conformance suite at -O2 (BINATE_FLAGS), so the -O1+ IR optimization
# passes — fuse-mul-add, LICM, SROA, mem2reg, simplify-identities, the BCE
# family, and the named-constant magic-division path — are actually exercised
# end-to-end.  The default Conformance workflow runs at -O0, where RunOptPasses
# early-returns and none of those passes (nor the OP_MADD/OP_MSUB lowering they
# feed) run; a lowering regression there ships green.  This job closes that gap
# across all three architectures (aa64, x64, arm32) plus the LLVM and VM
# backends.  These are the same modes the default workflow already runs green at
# -O0, so any -O2 failure is a real optimizer/lowering defect and blocks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BINATE_FLAGS: -O2

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One mode per lowering surface at -O2.  native_aa64 needs an aarch64
        # host (macos-latest is Apple Silicon); the rest run on x86_64 ubuntu.
        # Slow modes are sharded (run.sh --shard i/N runs a disjoint 1/N slice)
        # to fit the 30-min per-job cap, mirroring the default workflow's tuning.
        include:
          # LLVM backend (host x86_64).
          - { mode: builder-comp, os: ubuntu-latest, shard: "1/1" }
          # Bytecode VM.
          - { mode: builder-comp-int, os: ubuntu-latest, shard: "1/2" }
          - { mode: builder-comp-int, os: ubuntu-latest, shard: "2/2" }
          # Native aarch64 backend (Apple Silicon runner).
          - { mode: builder-comp_native_aa64-comp_native_aa64, os: macos-latest, shard: "1/2" }
          - { mode: builder-comp_native_aa64-comp_native_aa64, os: macos-latest, shard: "2/2" }
          # Native x86-64 backend.
          - { mode: builder-comp_native_x64-comp_native_x64, os: ubuntu-latest, shard: "1/2" }
          - { mode: builder-comp_native_x64-comp_native_x64, os: ubuntu-latest, shard: "2/2" }
          # Native arm32 backend (soft-float baremetal, under qemu-system-arm).
          - { mode: builder-comp_native_arm32_baremetal, os: ubuntu-latest, shard: "1/3" }
          - { mode: builder-comp_native_arm32_baremetal, os: ubuntu-latest, shard: "2/3" }
          - { mode: builder-comp_native_arm32_baremetal, os: ubuntu-latest, shard: "3/3" }
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        # Matches the default Conformance workflow: lld + qemu-system-arm for the
        # baremetal image, and gcc-arm-none-eabi for the AEABI helper archive
        # (libgcc.a) clang discovers via its GCC-toolchain search on PATH.
        run: sudo apt-get install -y lld qemu-system-arm gcc-arm-none-eabi

      - name: Conformance tests -O2 (${{ matrix.mode }} shard ${{ matrix.shard }})
        # --shard is a FLAG and must precede the mode positional.  BINATE_FLAGS
        # (=-O2, from the job env) is read by run.sh and passed to the compiler.
        run: binate/conformance/run.sh -v --shard ${{ matrix.shard }} ${{ matrix.mode }}
