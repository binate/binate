name: Conformance tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.  Each mode carries an
          # `experimental` flag: true => allowed to fail (continue-on-error).
          entries=$(
            {
              grep -v '^#' scripts/modesets/all | grep -v '^$' | sed 's/$/ false/'
              # builder-comp_arm32_linux_int: the bytecode VM on a 32-bit host
              # (explorations/plan-vm-64bit-on-32bit.md).  Red-signal mode —
              # non-blocking until its Phase-3 32-bit-host fixes land.
              # Conformance-only, so NOT in scripts/modesets/all (which the
              # unit/perf/xpass matrices also read).
              echo "builder-comp_arm32_linux_int true"
              # builder-comp_native_arm32_baremetal: the native arm32 backend
              # (pkg/binate/native/arm32, explorations/plan-native-arm32.md) —
              # same corpus/env as builder-comp_arm32_baremetal but the main
              # module's IR->.o goes through --backend native.  BLOCKING: the
              # baremetal soft-float backend is fully green (P0-P5 done).
              # Conformance-only (needs qemu-system-arm + clang), so NOT in
              # scripts/modesets/all — the arm32-baremetal toolchain install step
              # below matches it via the `arm32_baremetal` substring.
              echo "builder-comp_native_arm32_baremetal false"
              # builder-comp_native_arm32_linux: the native arm32 backend's
              # HARD-float (AAPCS-VFP) Linux/ELF output (pkg/binate/native/arm32,
              # explorations/plan-native-arm32.md P6) — same corpus/env as
              # builder-comp_arm32_linux (LLVM) but the main module's IR->.o goes
              # through --backend native.  EXPERIMENTAL, but nearly done: the whole
              # inc 3f VFP float-through-shim tail (including the >8-float-arg
              # VFP-bank-spill overflow shape, conformance 707/888/926) is now
              # COMPLETE and green — "no documented fail-loud remaining" per the plan.
              # The one real remaining failure is regressions/c-call/printf-variadic-
              # float: a float passed to a VARIADIC callee must ride the GP regs /
              # outgoing-args stack (AAPCS-VFP passes variadic args by the base
              # standard, not in VFP), which the native backend does not yet do —
              # that is inc 3c/3e (variadic-floats-in-GP), a SEPARATE increment from
              # the 3f VFP work above.  Promote to blocking (plan P7) once that lands
              # (or the one test is xfail'd).  (An HFA aggregate is GP-coerced —
              # inc 3f(a) true VFP-HFA is deferred but self-consistent, not fail-loud.)
              # Conformance-only (needs the arm32-linux cross-toolchain + qemu-user,
              # matched by the `arm32_linux` substring below), so NOT in
              # scripts/modesets/all.
              echo "builder-comp_native_arm32_linux true"
              # builder-comp_native_aa64_linux: the aarch64 native backend's
              # Linux/ELF output (vs the macOS/Mach-O builder-comp_native_aa64),
              # run under qemu-aarch64.  First end-to-end coverage of the aarch64
              # ELF data + GOT relocations.  Red-signal while the aarch64-linux
              # native path is exercised for the first time.  Conformance-only,
              # so NOT in scripts/modesets/all.  Its qemu-aarch64 + cross-libc
              # come from the aa64_linux toolchain step below.
              echo "builder-comp_native_aa64_linux-comp_native_aa64_linux true"
            } | while read m exp; do
              case "$m" in
                # aarch64-LINUX native runs on x86_64 + qemu-aarch64 (there is
                # no linux-arm64 BUILDER bundle yet, so no native arm64 runner).
                # MUST precede *native_aa64* — that glob would otherwise route it
                # to macos-latest (the AArch64/macOS/Mach-O mode).
                *native_aa64_linux*) os=ubuntu-latest ;;
                *native_aa64*)       os=macos-latest ;;
                *)                   os=ubuntu-latest ;;
              esac
              jq -nc --arg mode "$m" --arg os "$os" --argjson exp "$exp" \
                '{mode: $mode, os: $os, experimental: $exp}'
            done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  test:
    needs: modes
    runs-on: ${{ matrix.os }}
    # Experimental modes (matrix.experimental=true) may fail without failing the
    # suite — builder-comp_arm32_linux_int (Phase-3 32-bit-host fixes pending),
    # builder-comp_native_aa64_linux (aarch64 native ELF path exercised for the
    # first time), and builder-comp_native_arm32_linux (hard-float; the VFP-bank-
    # spill FP-arg-overflow shim tail is still fail-loud) are red-signal until
    # their fixes land.  builder-comp_native_arm32_baremetal (soft-float) is now
    # BLOCKING (experimental=false) — see the matrix build above.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        # gcc-arm-linux-gnueabihf brings in the cross-gcc (and
        # binutils-arm-linux-gnueabihf + libc6-{,dev-}armhf-cross
        # as deps), all under /usr/arm-linux-gnueabihf/.  Clang
        # under `-target arm-linux-gnueabihf` auto-discovers that
        # install root for headers + cross-ld.  qemu-user-static
        # runs the resulting binary under user-mode emulation.
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # Stock `clang` on ubuntu-latest only ships compiler-rt
          # builtins for the host arch — the cross-target armhf
          # archive isn't in the noble apt sources (the multi-arch
          # `:armhf` route on x86_64 ignores the bare-metal target
          # entirely).  Use gcc-arm-none-eabi instead: provides
          # libgcc.a (the AEABI helpers — long-divide, long-shift,
          # long-compare) for `arm-none-eabi`, which clang can use
          # via its standard GCC-toolchain discovery on PATH.
          sudo apt-get install -y \
              lld qemu-system-arm gcc-arm-none-eabi
          # Sanity probe: where did the AEABI helpers land?
          find /usr -name 'libgcc.a' 2>/dev/null | grep -i arm || true

      - name: Install aarch64-linux cross-toolchain
        if: contains(matrix.mode, 'aa64_linux')
        # gcc-aarch64-linux-gnu brings the cross-gcc + binutils +
        # libc6-{,dev-}arm64-cross (headers + cross-ld under
        # /usr/aarch64-linux-gnu/), which clang -target aarch64-linux-gnu
        # auto-discovers — the same mechanism the arm32_linux mode relies on.
        # qemu-user-static provides qemu-aarch64 to run the produced aarch64
        # binary under user-mode emulation on the x86_64 host.
        run: sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: Conformance tests (${{ matrix.mode }})
        run: binate/conformance/run.sh -v ${{ matrix.mode }}
