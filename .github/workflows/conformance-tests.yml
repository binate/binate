name: Conformance tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.
          entries=$(grep -v '^#' scripts/modesets/all | grep -v '^$' | while read m; do
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            jq -nc --arg mode "$m" --arg os "$os" '{mode: $mode, os: $os}'
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  test:
    needs: modes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        run: sudo apt-get install -y libc6-armhf-cross linux-libc-dev-armhf-cross qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # Stock `clang` on ubuntu-latest only ships compiler-rt
          # builtins for the host arch.  ARM bare-metal needs the
          # AEABI helpers (long-divide, long-shift, long-compare)
          # which live in compiler-rt's armhf cross-target archive.
          # `libclang-rt-dev` is a version-agnostic meta-package
          # that pulls in the matching clang-rt-NN-dev for the
          # installed clang; for the cross-target armhf archive we
          # add multi-arch armhf and install the :armhf variant.
          sudo apt-get install -y lld qemu-system-arm libclang-rt-dev
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y libclang-rt-dev:armhf
          # Sanity probe: where did the builtin archive land?
          find /usr/lib -name 'libclang_rt.builtins*armhf*' 2>/dev/null || true

      - name: Conformance tests (${{ matrix.mode }})
        run: binate/conformance/run.sh -v ${{ matrix.mode }}
