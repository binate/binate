# On-demand stale-xfail sweep.  The push/PR `Conformance tests` workflow
# SKIPS xfailed tests, so an xfail that has since started passing sits
# marked-failing forever (invisible).  This workflow re-runs the xfailed
# tests with `--check-xpass`: any that PASS are reported as XPASS and fail
# the run — that failure is the signal "these markers are stale, remove
# them."  Green = no stale xfails in that mode.
#
# It is `workflow_dispatch` ONLY (never push/PR/cron): re-running xfailed
# tests is exactly the set most likely to hang or be pathologically slow,
# so a human kicks it off and watches.  `timeout-minutes` still bounds each
# job, turning any hang into a bounded failure rather than an infinite one.
#
# Only the currently-xfailed tests are run (enumerated per mode), not the
# whole suite — the toolchain build dominates either way, and this skips
# ~1400 passing tests, which matters most for the qemu-emulated arm32 lanes.
name: Conformance XPASS (stale-xfail sweep)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single mode to sweep (blank = every mode in scripts/modesets/all)"
        required: false
        default: ""

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.  When MODE_INPUT
          # is set, restrict the matrix to just that mode.
          entries=$(grep -v '^#' scripts/modesets/all | grep -v '^$' | while read m; do
            if [ -n "$MODE_INPUT" ] && [ "$m" != "$MODE_INPUT" ]; then continue; fi
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            jq -nc --arg mode "$m" --arg os "$os" '{mode: $mode, os: $os}'
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: modes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        # gcc-arm-linux-gnueabihf brings in the cross-gcc (and
        # binutils-arm-linux-gnueabihf + libc6-{,dev-}armhf-cross
        # as deps), all under /usr/arm-linux-gnueabihf/.  Clang
        # under `-target arm-linux-gnueabihf` auto-discovers that
        # install root for headers + cross-ld.  qemu-user-static
        # runs the resulting binary under user-mode emulation.
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # Stock `clang` on ubuntu-latest only ships compiler-rt
          # builtins for the host arch — the cross-target armhf
          # archive isn't in the noble apt sources (the multi-arch
          # `:armhf` route on x86_64 ignores the bare-metal target
          # entirely).  Use gcc-arm-none-eabi instead: provides
          # libgcc.a (the AEABI helpers — long-divide, long-shift,
          # long-compare) for `arm-none-eabi`, which clang can use
          # via its standard GCC-toolchain discovery on PATH.
          sudo apt-get install -y \
              lld qemu-system-arm gcc-arm-none-eabi
          # Sanity probe: where did the AEABI helpers land?
          find /usr -name 'libgcc.a' 2>/dev/null | grep -i arm || true

      - name: Check-xpass sweep (${{ matrix.mode }})
        shell: bash
        run: |
          set -uo pipefail
          cd binate
          MODE='${{ matrix.mode }}'
          # Collect the tests currently xfailed in THIS mode into the
          # positional args ("$@"), one filter per test.  The conformance
          # test name is the path relative to conformance/ with the
          # .xfail.<mode> suffix removed — exactly what run.sh's substring
          # filter matches against.  Enumerate RECURSIVELY: the matrix/ and
          # regressions/ subtrees hold most of the markers.
          #
          # We build "$@" via a read loop (not unquoted `$names`) on
          # purpose: an unquoted expansion that someone later "fixes" to be
          # quoted would collapse to a single blob argument, match no test,
          # and exit GREEN having swept nothing — a silent no-op.  "$@" can't
          # be broken that way.
          set --
          while IFS= read -r n; do
            [ -n "$n" ] && set -- "$@" "$n"
          # Enumerate both the mode-specific markers and the mode-independent
          # .xfail.all markers (which apply to every mode, so they must be
          # swept here too) — see conformance/run.sh.
          done < <(find conformance \( -name "*.xfail.$MODE" -o -name "*.xfail.all" \) \
            | sed -E "s#^conformance/##; s#\.xfail\.($MODE|all)\$##" | sort -u)
          if [ "$#" -eq 0 ]; then
            echo "No xfails marked for mode $MODE — nothing to sweep."
            exit 0
          fi
          echo "Sweeping $# xfailed test(s) for $MODE:"
          printf '  %s\n' "$@"
          # --check-xpass runs the xfailed tests anyway; run.sh exits
          # non-zero (failing this job) if any PASSES — an XPASS, i.e. a
          # stale marker to delete.  --exact: match each filter to its exact
          # test name, so e.g. the `value-struct` xfail filter does not also
          # pull in (and run, possibly failing) the unmarked `value-struct-large`.
          conformance/run.sh -v --check-xpass --exact "$MODE" "$@"
