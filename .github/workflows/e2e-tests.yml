name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Each top-level *.sh in e2e/ is one matrix entry, run on BOTH
          # Linux and macOS — some tests (e.g. errno-values) are
          # OS-specific and verify whichever host they run on. The "name"
          # is the filename without the .sh extension. New e2e scripts are
          # picked up automatically — no workflow edit required.
          scripts=$(ls e2e/*.sh | xargs -n1 basename | sed 's/\.sh$//' | jq -R . | jq -sc .)
          echo "matrix={\"script\":$scripts,\"os\":[\"ubuntu-latest\",\"macos-latest\"]}" >> "$GITHUB_OUTPUT"

  test:
    needs: scripts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.scripts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux; macOS ships clang)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32 qemu + cross-toolchain (arm32 e2e scripts, Linux)
        # arm32-toolchain-smoke cross-builds the tools for arm32-linux and runs
        # them under qemu-user; qemu-user-static provides qemu-arm and
        # gcc-arm-linux-gnueabihf provides the cross-linker + arm32 glibc.  Only
        # the arm32 e2e scripts need this, so gate on the script name to keep the
        # other (majority) e2e jobs lean.  arm32-aeabi-dormant-helpers additionally
        # needs qemu-system-arm, which is NOT installed here — it stays SKIP until
        # that is added with its own validation, so this step only turns on the
        # already-validated toolchain smoke.
        if: runner.os == 'Linux' && startsWith(matrix.script, 'arm32')
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static gcc-arm-linux-gnueabihf

      - name: E2E test (${{ matrix.script }})
        # Via the wrapper so per-OS e2e/<name>.{skip,xfail}[.<os>] markers are
        # honored (known-infra / pending-phase failures don't red the gate; an
        # unexpected pass under an xfail marker is flagged XPASS).
        run: binate/scripts/e2e-run.sh ${{ matrix.script }}
