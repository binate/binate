name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Each top-level *.sh in e2e/ is one matrix entry. The
          # "name" is the filename without the .sh extension. New
          # e2e scripts are picked up automatically — no workflow
          # edit required.
          scripts=$(ls e2e/*.sh | xargs -n1 basename | sed 's/\.sh$//' | jq -R . | jq -sc .)
          echo "matrix={\"script\":$scripts}" >> "$GITHUB_OUTPUT"

  test:
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.scripts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: E2E test (${{ matrix.script }})
        run: binate/e2e/${{ matrix.script }}.sh
