name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every check in scripts/hygiene/ runs as its own job, so each gets its own
# pass/fail in the UI.  The job list is enumerated from the directory, so adding
# a check is just dropping a script into scripts/hygiene/ -- no edit here.

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.enumerate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: enumerate
        run: |
          checks=$(ls scripts/hygiene/*.sh \
            | grep -v '/run\.sh$' \
            | xargs -n1 basename \
            | sed 's/\.sh$//' \
            | jq -R . | jq -sc .)
          echo "matrix={\"check\":$checks}" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    runs-on: ubuntu-latest
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      # lint / bnfmt-format / fetch-builder build the self-hosted tools from the
      # BUILDER bnc that fetch-builder downloads (BUILDER_VERSION is bnc-*, a
      # prebuilt release tarball) and compile/link via clang.  No bootstrap
      # checkout / Go -- those were only for the retired bootstrap-* scheme.  The
      # other checks are pure shell and need nothing.
      - name: Install clang
        if: >-
          matrix.check == 'lint' ||
          matrix.check == 'bnfmt-format' ||
          matrix.check == 'fetch-builder'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: ${{ matrix.check }}
        run: ./scripts/hygiene/${{ matrix.check }}.sh
