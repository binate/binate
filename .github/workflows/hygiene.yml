name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File length
        id: file-length
        run: ./scripts/hygiene/file-length.sh
        continue-on-error: true

      - name: Line length
        id: line-length
        run: ./scripts/hygiene/line-length.sh
        continue-on-error: true

      - name: Test coverage
        id: test-coverage
        run: ./scripts/hygiene/test-coverage.sh
        continue-on-error: true

      - name: Check results
        if: steps.file-length.outcome == 'failure' || steps.line-length.outcome == 'failure' || steps.test-coverage.outcome == 'failure'
        run: exit 1
