name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: File length
        run: ./scripts/hygiene/file-length.sh

      - name: Line length
        if: always()
        run: ./scripts/hygiene/line-length.sh

      - name: Test coverage
        if: always()
        run: ./scripts/hygiene/test-coverage.sh

      - name: Conformance test numbers
        if: always()
        run: ./scripts/hygiene/conformance-test-numbers.sh

      - name: .bni godoc
        if: always()
        run: ./scripts/hygiene/bni-doc.sh

      - name: File format
        if: always()
        run: ./scripts/hygiene/file-format.sh

      - name: Naming
        if: always()
        run: ./scripts/hygiene/naming.sh

      - name: .bn godoc
        if: always()
        run: ./scripts/hygiene/bn-doc.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: bootstrap/go.mod

      - name: bnlint
        run: binate/scripts/hygiene/lint.sh
