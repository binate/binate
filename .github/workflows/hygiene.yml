name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hygiene checks
        run: |
          failed=0
          echo "=== File length ==="
          ./scripts/hygiene/file-length.sh || failed=1
          echo ""
          echo "=== Line length ==="
          ./scripts/hygiene/line-length.sh || failed=1
          echo ""
          echo "=== Test coverage ==="
          ./scripts/hygiene/test-coverage.sh || failed=1
          echo ""
          if [ "$failed" -ne 0 ]; then
            echo "One or more hygiene checks failed."
            exit 1
          fi
