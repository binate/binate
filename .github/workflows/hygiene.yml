name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File length
        run: ./scripts/hygiene/file-length.sh

      - name: Line length
        if: always()
        run: ./scripts/hygiene/line-length.sh

      - name: Test coverage
        if: always()
        run: ./scripts/hygiene/test-coverage.sh
