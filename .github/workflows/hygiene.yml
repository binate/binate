name: Code hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File length
        run: ./scripts/hygiene/file-length.sh

      - name: Line length
        run: ./scripts/hygiene/line-length.sh

      - name: Test coverage
        run: ./scripts/hygiene/test-coverage.sh
