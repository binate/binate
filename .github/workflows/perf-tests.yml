name: Perf tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.  arm32_* modes
          # (arm32_linux, arm32_baremetal) run under QEMU user-mode
          # / virt-machine emulation, so their timings aren't
          # representative — exclude from perf and rely on the
          # conformance + unit-test workflows for correctness
          # coverage.
          entries=$(grep -v '^#' scripts/modesets/all \
              | grep -v '^$' | grep -v 'arm32_' | while read m; do
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            jq -nc --arg mode "$m" --arg os "$os" '{mode: $mode, os: $os}'
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  test:
    needs: modes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Perf tests (${{ matrix.mode }})
        # Tee the per-mode output to a file so the summary job can
        # aggregate. Preserve the runner's exit code via PIPESTATUS
        # (bash) so a perf failure still fails this job.
        shell: bash
        run: |
          mkdir -p perf-out
          binate/perf/run.sh ${{ matrix.mode }} \
            2>&1 | tee "perf-out/${{ matrix.mode }}.txt"
          exit "${PIPESTATUS[0]}"

      # Upload regardless of exit code — the summary job aggregates
      # whatever each mode produced. The artifact name uses the mode
      # so the summary job can download all of them in one call.
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ matrix.mode }}
          path: perf-out/${{ matrix.mode }}.txt
          retention-days: 14

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Download all perf results
        uses: actions/download-artifact@v8
        with:
          pattern: perf-results-*
          path: perf-out
          merge-multiple: true

      - name: Render summary
        shell: bash
        run: |
          # Aggregate per-mode `perf-out/<mode>.txt` outputs into a
          # single markdown table with tests as rows and modes as
          # columns. Each cell shows the `run=` figure (or COMPILE_ERROR
          # / SKIP / FAIL marker) so timing regressions and skipped
          # modes are visible at a glance.
          binate/perf/summarize.sh perf-out >> "$GITHUB_STEP_SUMMARY"
