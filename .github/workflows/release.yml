name: Release

# Triggers on `bnc-X.Y.Z` tag push.  Builds the four release binaries
# (bnc, bni, bnas, bnlint) for each platform in the release matrix
# (linux-x64, macos-x64, macos-arm64), packs them with the standard
# library (`pkg/` and `runtime/`) into a per-platform tarball, and
# attaches the tarballs + a SHA256SUMS manifest to a GitHub release
# named after the tag.  Consumers verify their download via the
# manifest before extracting.
#
# Tarball layout (extracted):
#   bnc-X.Y.Z-<platform>/
#     bin/{bnc,bni,bnas,bnlint}
#     lib/pkg/        the bundled standard library matching this bnc
#     lib/runtime/    the bundled C runtime (binate_runtime.c + stubs)
#
# The "lib" tree is what bnc / bni / bnas / bnlint resolve against
# when callers pass `-I <bundle>/lib -L <bundle>/lib`.  Bundling lets
# a release ship with a stdlib pinned to that binary; callers can
# still prepend their own checkout to override (paths search front
# to back).
#
# Build chain: scripts/build-{bnc,bni,bnas,bnlint}.sh each go through
# scripts/fetch-builder.sh to resolve a BUILDER_VERSION binary.  For
# the first bnc-X.Y.Z release `BUILDER_VERSION` is bootstrap-X.Y.Z;
# the fetcher checks out the sibling bootstrap repo and `go build`s
# it.  Subsequent releases use the previous bnc release (via the
# fetcher's bnc-X.Y.Z download path).
#
# See explorations/plan-bnc-as-builder.md.

on:
  push:
    tags:
      - 'bnc-*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          # macos-x64 (macos-13) is omitted: GitHub-hosted macos-13
          # runners can sit in the queue for hours with no pickup,
          # which blocks the release-publish job behind a matrix
          # shard that may never run.  Re-add when we either have
          # self-hosted x86 mac capacity or GitHub-hosted macos-x64
          # availability improves.
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      # The fetcher script reads BUILDER_VERSION and, for
      # bootstrap-X.Y.Z, expects the bootstrap repo as a sibling
      # checkout.  When BUILDER_VERSION later names a bnc-X.Y.Z, the
      # fetcher will download from a prior release instead and this
      # step can become conditional.
      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build bundle
        id: build
        run: |
          set -e
          version="${GITHUB_REF_NAME}"            # "bnc-0.0.1"
          bundle="${version}-${{ matrix.platform }}"
          asset="${bundle}.tar.gz"
          stage="$RUNNER_TEMP/stage/$bundle"
          mkdir -p "$stage/bin" "$stage/lib"

          # Build each release binary directly into the staged bin/.
          # Each script independently goes through fetch-builder.sh,
          # so the first bnc-X.Y.Z release rebuilds bootstrap once
          # per binary — acceptable cost for an initial release;
          # later releases reuse the prebuilt previous bnc and are
          # much faster.
          binate/scripts/build-bnc.sh    -o "$stage/bin/bnc"
          binate/scripts/build-bni.sh    -o "$stage/bin/bni"
          binate/scripts/build-bnas.sh   -o "$stage/bin/bnas"
          binate/scripts/build-bnlint.sh -o "$stage/bin/bnlint"

          # Bundle the standard library that matches these binaries.
          # `cp -R` keeps the source tree layout intact so callers can
          # point `-I <root>/lib -L <root>/lib` (plus the per-tier
          # sub-roots `<root>/lib/ifaces/core` and
          # `<root>/lib/impls/core/{common,libc}`) at it directly.
          cp -R binate/pkg     "$stage/lib/pkg"
          cp -R binate/runtime "$stage/lib/runtime"
          cp -R binate/ifaces  "$stage/lib/ifaces"
          cp -R binate/impls   "$stage/lib/impls"

          # Pack the tarball.  COPYFILE_DISABLE silences macOS's
          # AppleDouble (._foo) metadata files so the archive
          # contents are reproducible across platforms.
          mkdir -p "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/stage" && COPYFILE_DISABLE=1 tar -czf \
              "$RUNNER_TEMP/dist/$asset" "$bundle")
          out="$RUNNER_TEMP/dist/$asset"
          test -s "$out"

          # SHA256 of the tarball for the manifest.
          if command -v sha256sum >/dev/null; then
            sha="$(sha256sum "$out" | awk '{print $1}')"
          else
            sha="$(shasum -a 256 "$out" | awk '{print $1}')"
          fi
          printf "%s  %s\n" "$sha" "$asset" > "$out.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (build matrix output)
        # Each matrix job uploads its tarball + sha256 line as a
        # workflow artifact; the `release` job then collects them all
        # and attaches them to the GitHub release in one go.  Keeping
        # the per-job uploads separate from the release publish step
        # avoids matrix-job races against `gh release create`.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.asset }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble manifest
        run: |
          set -e
          mkdir -p release
          # actions/download-artifact lays out one subdir per artifact
          # name; flatten so the release uploader sees a single dir of
          # files.  Then assemble a single SHA256SUMS manifest by
          # concatenating each artifact's sha256 line.
          for d in dist/*; do
            cp "$d"/* release/
          done
          : > release/SHA256SUMS
          for s in release/*.sha256; do
            cat "$s" >> release/SHA256SUMS
            rm "$s"
          done
          ls -la release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="${GITHUB_REF_NAME}"
          # Idempotent create-or-edit: if the release already exists
          # (manual create, or a rerun), `gh release upload` adds the
          # tarballs in place; otherwise `gh release create` makes a
          # fresh one.  `--generate-notes` builds the release body
          # from commits since the previous tag.
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber
          else
            gh release create "$version" \
              --title "$version" \
              --generate-notes \
              release/*
          fi
