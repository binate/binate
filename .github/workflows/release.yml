name: Release

# Triggers on `bnc-X.Y.Z` tag push.  Builds bnc binaries for the
# release matrix (linux-x64, macos-x64, macos-arm64), uploads each
# to a GitHub release named after the tag, and writes a SHA256
# manifest as an extra release asset so consumers can verify the
# binary they downloaded matches what this workflow built.
#
# The build itself goes through scripts/build-bnc.sh, which uses
# scripts/fetch-builder.sh to resolve a BUILDER_VERSION binary.
# For the first bnc-X.Y.Z release `BUILDER_VERSION` is
# bootstrap-X.Y.Z; the fetcher checks out the sibling bootstrap repo
# and `go build`s it.  Subsequent releases use the previous bnc
# release (once fetch-builder.sh grows the bnc-X.Y.Z download path).
#
# See explorations/plan-bnc-as-builder.md.

on:
  push:
    tags:
      - 'bnc-*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-13
            platform: macos-x64
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      # The fetcher script reads BUILDER_VERSION and, for
      # bootstrap-X.Y.Z, expects the bootstrap repo as a sibling
      # checkout.  When BUILDER_VERSION later names a bnc-X.Y.Z, the
      # fetcher will download from a prior release instead and this
      # step can become conditional.
      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build bnc
        id: build
        run: |
          set -e
          version="${GITHUB_REF_NAME}"            # "bnc-0.0.1"
          artifact="${version}-${{ matrix.platform }}"
          mkdir -p "$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/dist/$artifact"
          binate/scripts/build-bnc.sh -o "$out"
          # Sanity-check: the binary should be executable and at
          # least respond to --help (or exit-on-noop) without
          # blowing up.  Catches build issues earlier than the
          # upload step.
          test -x "$out"
          # SHA256 of the binary for the manifest.
          if command -v sha256sum >/dev/null; then
            sha="$(sha256sum "$out" | awk '{print $1}')"
          else
            sha="$(shasum -a 256 "$out" | awk '{print $1}')"
          fi
          printf "%s  %s\n" "$sha" "$artifact" > "$out.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (build matrix output)
        # Each matrix job uploads its binary + sha256 line as a
        # workflow artifact; the `release` job then collects them all
        # and attaches them to the GitHub release in one go.  Keeping
        # the per-job uploads separate from the release publish step
        # avoids matrix-job races against `gh release create`.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble manifest
        run: |
          set -e
          mkdir -p release
          # actions/download-artifact lays out one subdir per artifact
          # name; flatten so the release uploader sees a single dir of
          # files.  Then assemble a single SHA256SUMS manifest by
          # concatenating each artifact's sha256 line.
          for d in dist/*; do
            cp "$d"/* release/
          done
          : > release/SHA256SUMS
          for s in release/*.sha256; do
            cat "$s" >> release/SHA256SUMS
            rm "$s"
          done
          ls -la release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="${GITHUB_REF_NAME}"
          # Idempotent create-or-edit: if the release already exists
          # (manual create, or a rerun), `gh release edit` flips it
          # in place; otherwise `gh release create` makes a fresh
          # one.  `--generate-notes` builds the release body from
          # commits since the previous tag.
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber
          else
            gh release create "$version" \
              --title "$version" \
              --generate-notes \
              release/*
          fi
