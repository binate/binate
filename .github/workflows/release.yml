name: Release

# Triggers on `bnc-X.Y.Z` tag push.  Builds the release binaries
# (bnc, bni, bnas, bnlint, bnfmt) for each platform in the release matrix
# (linux-x64, linux-arm64, macos-arm64), packs them with the standard
# library and runtime (the `lib/` tree) into a per-platform tarball,
# and attaches the tarballs + a SHA256SUMS manifest to a GitHub release
# named after the tag.  Consumers verify their download via the
# manifest before extracting.
#
# Tarball layout (extracted):
#   bnc-X.Y.Z-<platform>/
#     bin/{bnc,bni,bnas,bnlint,bnfmt}
#     lib/{pkg,runtime,ifaces,impls}/   stdlib + runtime matching these binaries
#
# The "lib" tree is what bnc / bni / bnas / bnlint resolve against;
# BUNDLE-HOWTO.md documents how a consumer points -I/-L/--runtime at
# it.  Bundling lets a release ship with a stdlib pinned to that
# binary; callers can still prepend their own checkout to override
# (paths search front to back).  scripts/make-bundle.sh has the full
# layout.
#
# Build chain: scripts/make-bundle.sh builds the five binaries — each
# via scripts/build-{bnc,bni,bnas,bnlint,bnfmt}.sh, which resolve a
# BUILDER_VERSION binary through scripts/fetch-builder.sh — then stages
# lib/ and packs the tarball.  BUILDER_VERSION names the previous
# bnc-X.Y.Z release; the fetcher downloads it (via its bnc-X.Y.Z
# download path).
#
# See explorations/plan-bnc-as-builder.md.

on:
  push:
    tags:
      - 'bnc-*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # linux-arm64 is CROSS-built on the x86_64 ubuntu runner (not a native
          # ubuntu-*-arm runner): there is no linux-arm64 BUILDER bundle to
          # self-host from yet, so make-bundle derives --target aarch64-linux and
          # build-*.sh cross-emit the arm64 binaries via the existing
          # bnc-*-linux-x64 BUILDER.  The cross-toolchain step below
          # (gcc-aarch64-linux-gnu) supplies the cross libc + ld.  Once a
          # linux-arm64 bundle ships, a later release could self-host natively.
          - os: ubuntu-latest
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          # macos-x64 (macos-13) is omitted: GitHub-hosted macos-13
          # runners can sit in the queue for hours with no pickup,
          # which blocks the release-publish job behind a matrix
          # shard that may never run.  Re-add when we either have
          # self-hosted x86 mac capacity or GitHub-hosted macos-x64
          # availability improves.
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install aarch64-linux cross-toolchain (linux-arm64 bundle)
        if: matrix.platform == 'linux-arm64'
        # gcc-aarch64-linux-gnu brings the cross libc + headers + cross-ld under
        # /usr/aarch64-linux-gnu/, which clang -target aarch64-linux-gnu
        # auto-discovers (the same mechanism the conformance aa64_linux mode
        # relies on).  No qemu: the release only BUILDS the arm64 binaries here,
        # it never runs them.
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build bundle
        id: build
        run: |
          set -e
          version="${GITHUB_REF_NAME}"            # "bnc-0.0.1"
          platform="${{ matrix.platform }}"
          asset="${version}-${platform}.tar.gz"
          outdir="$RUNNER_TEMP/dist"

          # All bundle assembly — build the four binaries, stage lib/,
          # pack the tarball, write the .sha256 — lives in
          # scripts/make-bundle.sh so local and released bundles are
          # built identically.  The asset name and path are
          # deterministic, so derive the step outputs directly rather
          # than parsing the script.
          binate/scripts/make-bundle.sh \
            --version "$version" \
            --platform "$platform" \
            --out-dir "$outdir"

          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "out=$outdir/$asset" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (build matrix output)
        # Each matrix job uploads its tarball + sha256 line as a
        # workflow artifact; the `release` job then collects them all
        # and attaches them to the GitHub release in one go.  Keeping
        # the per-job uploads separate from the release publish step
        # avoids matrix-job races against `gh release create`.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.asset }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble manifest
        run: |
          set -e
          mkdir -p release
          # actions/download-artifact lays out one subdir per artifact
          # name; flatten so the release uploader sees a single dir of
          # files.  Then assemble a single SHA256SUMS manifest by
          # concatenating each artifact's sha256 line.
          for d in dist/*; do
            cp "$d"/* release/
          done
          : > release/SHA256SUMS
          for s in release/*.sha256; do
            cat "$s" >> release/SHA256SUMS
            rm "$s"
          done
          ls -la release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="${GITHUB_REF_NAME}"
          # A bnc-X.Y.ZpreN tag is a PRE-RELEASE (a general toolchain
          # bundle used e.g. as CHECK_TOOLS_VERSION — see
          # explorations/plan-check-tools-version.md), not a stable
          # release: mark it --prerelease so GitHub does not surface it
          # as "Latest".  Stable bnc-X.Y.Z tags (no `pre`) publish
          # normally.
          prerelease_flag=""
          case "$version" in
            *pre*) prerelease_flag="--prerelease" ;;
          esac
          # Idempotent create-or-edit: if the release already exists
          # (manual create, or a rerun), `gh release upload` adds the
          # tarballs in place; otherwise `gh release create` makes a
          # fresh one.  `--generate-notes` builds the release body
          # from commits since the previous tag.
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/* --clobber
          else
            gh release create "$version" \
              --title "$version" \
              --generate-notes \
              $prerelease_flag \
              release/*
          fi
