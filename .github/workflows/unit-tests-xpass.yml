# On-demand stale-xfail sweep for UNIT TESTS.  The push/PR `Unit tests`
# workflow SKIPS xfailed packages (scripts/unittest/<pkg-key>.xfail.<mode>),
# so an xfail that has since started passing sits marked-failing forever
# (invisible).  This workflow re-runs the suite with `--check-xpass`: any
# xfailed package that now PASSES is reported as XPASS and fails the run —
# that failure is the signal "these markers are stale, remove them."
# Green = no stale unittest xfails in that mode.
#
# It is `workflow_dispatch` ONLY (never push/PR/cron): re-running xfailed
# packages is exactly the set most likely to hang or be pathologically slow
# (nearly all unittest xfails are the qemu-emulated native-arm32 lane, which
# the regular run SKIPS — so it is never feasible to sweep them locally or on
# every push), so a human kicks it off and watches.  `timeout-minutes` bounds
# each job, turning any hang into a bounded failure rather than an infinite one.
#
# This is the unit-test half of the stale-xfail sweep; conformance-xpass.yml is
# the conformance half (the unittest `--check-xpass` was previously CI-unwired).
# A mode with NO xfail markers is skipped BEFORE building the toolchain (nothing
# to sweep).  For a mode that HAS markers the whole package suite runs with
# `--check-xpass` — the unittest runner has no exact-filter, and its ~30 packages
# are dominated by the toolchain build anyway, so re-running the passing packages
# too is cheap; the XPASS logic applies only to the xfailed ones.  Toolchain
# setup is kept in lockstep with unit-tests.yml / conformance-xpass.yml.
name: Unit-test XPASS (stale-xfail sweep)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single mode to sweep (blank = every mode in scripts/modesets/all)"
        required: false
        default: ""

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on the
          # standard ubuntu-latest x86_64 runner.  When MODE_INPUT is set,
          # restrict the matrix to just that mode.
          entries=$(grep -v '^#' scripts/modesets/all | grep -v '^$' | while read m; do
            if [ -n "$MODE_INPUT" ] && [ "$m" != "$MODE_INPUT" ]; then continue; fi
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            jq -nc --arg mode "$m" --arg os "$os" '{mode: $mode, os: $os}'
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: modes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        # See conformance-tests.yml for the rationale.
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # See conformance-tests.yml for the rationale — same install steps;
          # keep in lockstep.
          sudo apt-get install -y \
              lld qemu-system-arm gcc-arm-none-eabi
          find /usr -name 'libgcc.a' 2>/dev/null | grep -i arm || true

      - name: Check-xpass sweep (${{ matrix.mode }})
        shell: bash
        run: |
          set -uo pipefail
          cd binate
          MODE='${{ matrix.mode }}'
          # A mode with no unittest xfail markers has nothing to sweep — skip
          # BEFORE building the toolchain (which dominates the runtime).  Markers
          # live at scripts/unittest/<pkg-key>.xfail.<mode> (mode-specific) and
          # <pkg-key>.xfail.all (every mode); the package-key is the package path
          # with '/' replaced by '-'.  Both forms are enumerated below (nullglob
          # so an unmatched glob is empty, not a literal pattern).
          shopt -s nullglob
          markers=(scripts/unittest/*.xfail."$MODE" scripts/unittest/*.xfail.all)
          if [ "${#markers[@]}" -eq 0 ]; then
            echo "No unittest xfails marked for mode $MODE — nothing to sweep."
            exit 0
          fi
          echo "Unittest xfail markers for $MODE:"
          printf '  %s\n' "${markers[@]}"
          # --check-xpass runs the xfailed packages anyway (default skips them);
          # run.sh exits non-zero (failing this job) if any PASSES — an XPASS,
          # i.e. a stale marker to delete.  The whole package suite runs (the
          # unittest runner has no exact-filter); the XPASS logic applies only to
          # the xfailed packages, the rest just re-confirm as they do on push.
          scripts/unittest/run.sh -v --check-xpass "$MODE"
