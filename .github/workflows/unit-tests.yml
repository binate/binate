name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.  Each mode is
          # sharded across N runners (`--shard i/N` to run.sh) to
          # keep individual jobs under the timeout; bump SHARDS to
          # widen the split if a slow mode starts timing out again.
          # At 2 shards boot-comp 2/2 and boot-comp-int-int 1+2/2
          # were hitting the 30-min cap; 3 shards reduces each
          # shard's load by ~33% and absorbs the worst-case
          # double-bni timings comfortably.
          SHARDS=3
          entries=$(grep -v '^#' scripts/modesets/all | grep -v '^$' | while read m; do
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            for i in $(seq 1 "$SHARDS"); do
              jq -nc --arg mode "$m" --arg os "$os" \
                --arg shard "$i/$SHARDS" \
                '{mode: $mode, os: $os, shard: $shard}'
            done
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  test:
    needs: modes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - uses: actions/checkout@v6
        with:
          repository: binate/bootstrap
          path: bootstrap

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: bootstrap/go.mod

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        run: sudo apt-get install -y libc6-armhf-cross linux-libc-dev-armhf-cross qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # See conformance-tests.yml for the rationale — same
          # install steps; keep in lockstep.
          sudo apt-get install -y \
              lld qemu-system-arm gcc-arm-none-eabi
          find /usr -name 'libgcc.a' 2>/dev/null | grep -i arm || true

      - name: Unit tests (${{ matrix.mode }} shard ${{ matrix.shard }})
        run: binate/scripts/unittest/run.sh -v --shard ${{ matrix.shard }} ${{ matrix.mode }}
