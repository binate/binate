name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          # Per-mode runner: native_aa64 modes need an aarch64 host
          # (macos-latest is Apple Silicon); everything else runs on
          # the standard ubuntu-latest x86_64 runner.  Sharding
          # (`--shard i/N` to run.sh) only kicks in for the
          # double-interp modes — VM-on-VM is slow enough to need
          # multiple shards under the 30-min job cap.  Everything
          # else runs comfortably as a single shard.
          entries=$(grep -v '^#' scripts/modesets/all | grep -v '^$' | while read m; do
            case "$m" in
              *native_aa64*) os=macos-latest ;;
              *)             os=ubuntu-latest ;;
            esac
            # Shard the VM lanes: their tests run under the bytecode VM (single or
            # double), 1–2 orders of magnitude slower than native comp/native
            # lanes, so they need many shards to fit the per-job timeout.  Heavy
            # packages are TEST-split across all shards (scripts/unittest/*.split.vm
            # + run.sh + bni --test --shard-*); the shard count sets how finely the
            # lane's total work is divided.  Comp/native lanes are native-fast and
            # run as one shard.  (These counts are tuned empirically against the
            # 30/45-min job caps — see explorations/claude-todo.md "int-int".)
            case "$m" in
              *-comp-int-int)          shards=12 ;;  # double-VM: heaviest
              *-comp-int)              shards=6 ;;   # single-VM (-int / -comp-int)
              *)                       shards=1 ;;
            esac
            for i in $(seq 1 "$shards"); do
              jq -nc --arg mode "$m" --arg os "$os" \
                --arg shard "$i/$shards" \
                '{mode: $mode, os: $os, shard: $shard}'
            done
          done | jq -sc .)
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"

  test:
    needs: modes
    runs-on: ${{ matrix.os }}
    # The double-VM (-int-int) lane is inherently slow (VM interpreting the VM) and
    # non-blocking; give it a longer cap so 12 test-split shards fit comfortably.
    # Every other lane keeps the 30-min cap.
    timeout-minutes: ${{ contains(matrix.mode, 'int-int') && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.modes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: binate

      - name: Install clang (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install arm32-linux cross-toolchain
        if: contains(matrix.mode, 'arm32_linux')
        # See conformance-tests.yml for the rationale.
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user-static

      - name: Install arm32-baremetal cross-toolchain
        if: contains(matrix.mode, 'arm32_baremetal')
        run: |
          set -eux
          # See conformance-tests.yml for the rationale — same
          # install steps; keep in lockstep.
          sudo apt-get install -y \
              lld qemu-system-arm gcc-arm-none-eabi
          find /usr -name 'libgcc.a' 2>/dev/null | grep -i arm || true

      - name: Unit tests (${{ matrix.mode }} shard ${{ matrix.shard }})
        run: binate/scripts/unittest/run.sh -v --shard ${{ matrix.shard }} ${{ matrix.mode }}
